
name: Update profile icons

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: write

concurrency:
  group: update-works
  cancel-in-progress: false

jobs:
  update-icons:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libraries
        run: pip install requests beautifulsoup4

      - name: Update profile icons
        run: |
          python <<'PY'
          import json
          import time
          import re
          import html
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urlparse

          path = "works.json"

          with open(path, encoding="utf-8") as f:
              works = json.load(f)

          cache = {}

          for work in works:
              profile = work.get("profile", "")
              icon = work.get("icon", "")
              if profile and icon:
                  cache[profile] = icon

          session = requests.Session()
          session.headers.update({
              "User-Agent": "KotobaGenealogy/1.0",
              "Accept-Language": "ja,en;q=0.9"
          })

          def normalize(url):
              if not isinstance(url, str):
                  return ""

              url = html.unescape(url)
              url = url.replace("\\/", "/")
              url = url.replace("\\u002F", "/")
              url = url.replace("\\u0026", "&")
              url = url.replace("\\u003D", "=")

              return url.strip()

          def valid_icon(url):
              url = normalize(url)
              parsed = urlparse(url)

              return (
                  parsed.scheme == "https"
                  and parsed.hostname == "assets.st-note.com"
                  and "/profile_" in parsed.path
              )

          def get_icon(profile):
              parsed = urlparse(profile)

              if (
                  parsed.scheme != "https"
                  or parsed.hostname != "note.com"
              ):
                  return ""

              try:
                  response = session.get(
                      profile, timeout=20
                  )
                  response.raise_for_status()

                  soup = BeautifulSoup(
                      response.text, "html.parser"
                  )

                  print(f"確認中: {profile}")
                  print(f"HTTP: {response.status_code}")

                  # 方法1: メタ情報
                  for tag in soup.find_all("meta"):
                      key = tag.get("property") or tag.get("name")

                      if key in ("og:image", "twitter:image"):
                          url = normalize(tag.get("content", ""))

                          if valid_icon(url):
                              print("メタ情報から取得")
                              return url

                  # 方法2: HTML内の画像
                  candidates = set()

                  for img in soup.find_all("img"):
                      for attr in ("src", "data-src"):
                          url = normalize(img.get(attr, ""))

                          if valid_icon(url):
                              candidates.add(url.split("?")[0])

                  if len(candidates) == 1:
                      print("HTML画像から取得")
                      return next(iter(candidates))

                  # 方法3: ページ内の埋め込みデータ
                  source = normalize(response.text)

                  pattern = (
                      r'https://assets\.st-note\.com/'
                      r'[^\s"<>\\]+?/profile_'
                      r'[A-Za-z0-9_.-]+\.(?:jpg|jpeg|png|webp)'
                  )

                  matches = {
                      url for url in re.findall(
                          pattern, source, re.IGNORECASE
                      )
                      if valid_icon(url)
                  }

                  candidates.update(matches)

                  if len(candidates) == 1:
                      print("埋め込みデータから取得")
                      return next(iter(candidates))

                  if len(candidates) > 1:
                      print("画像候補が複数あるため保留")
                  else:
                      print("プロフィール画像が見つかりません")

              except requests.RequestException as e:
                  print(f"アクセス失敗: {e}")

              return ""

          changed = False

          for work in works:
              if work.get("icon"):
                  continue

              profile = work.get("profile", "")

              if not profile:
                  continue

              if profile not in cache:
                  cache[profile] = get_icon(profile)
                  time.sleep(2)

              icon = cache[profile]

              if icon:
                  work["icon"] = icon
                  changed = True
                  print(f"取得成功: {work['author']}")
              else:
                  print(f"未取得: {work['author']}")

          if changed:
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(
                      works,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )
                  f.write("\n")

          print("処理完了")
          PY

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- works.json; then
            git add works.json
            git commit -m "Update profile icons"
            git push
          else
            echo "No changes"
          fi
