
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ことば乗っ取りゲームから生まれた作品のつながりをたどるサイトです。">
  <title>ことばをたどる</title>

  <link rel="stylesheet" href="style.css?v=20261126-4">
  <link rel="stylesheet" href="design.css?v=2">

  <script src="script.js?v=20261126-11" defer></script>

  <style>
    .toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 12px;
    }

    .view-area,
    .mode-area {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .mode-area {
      margin-right: 0;
    }

    .control-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: .04em;
    }

    #mode,
    #view-mode {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--white);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    #mode-description {
      margin: 0;
      padding: 0 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      max-width: 360px;
      overflow-wrap: anywhere;
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      padding-top: 20px;
    }

    .zoom-controls button {
      white-space: nowrap;
    }

    /* PC・スマートフォン共通の描画領域 */
    .graph-area {
      position: relative;
      min-width: 0;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
    }

    .graph-area #tree {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
    }

    /* PC版の描画領域を確保 */
    @media (min-width: 701px) {

      .viewer {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .graph-area {
        flex: 1 1 0;
        min-height: 480px;
      }

      .graph-area #tree {
        display: block;
        flex: 1 1 0;
        height: 100%;
        min-height: 0;
      }

    }

    @media (max-width: 700px) {

      .toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        align-items: start;
        gap: 6px 8px;
        padding: 8px 10px;
      }

      .view-area,
      .mode-area {
        min-width: 0;
        width: 100%;
        margin: 0;
        gap: 4px;
      }

      .view-area {
        grid-column: 1;
        grid-row: 1 / 3;
      }

      .mode-area {
        display: contents;
      }

      .mode-area > .control-label {
        grid-column: 2;
        grid-row: 1;
      }

      #mode {
        grid-column: 2;
        grid-row: 2;
        align-self: end;
      }

      .control-label {
        font-size: 11px;
        line-height: 1.4;
      }

      #mode,
      #view-mode {
        font-size: 13px;
        padding: 8px;
        min-height: 44px;
        box-sizing: border-box;
      }

      #mode-description {
        grid-column: 1 / -1;
        grid-row: 3;
        max-width: none;
        width: 100%;
        box-sizing: border-box;
        font-size: 11px;
        line-height: 1.5;
        padding: 0 2px;
      }

      .toolbar:has(.mode-area[style*="display: none"])
      .view-area {
        grid-column: 1 / -1;
      }

      .zoom-controls {
        position: absolute;
        right: 10px;
        top: 8px;
        padding: 0;
        margin: 0;
        gap: 5px;
        z-index: 4;
      }

      .zoom-controls button {
        appearance: none;
        -webkit-appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        min-width: 44px;
        min-height: 44px;
        padding: 6px 10px;
        margin: 0;

        font-family: var(--rounded);
        font-size: 12px;
        font-weight: 500;
        line-height: 1.4;
        color: var(--text);

        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 6px;

        box-shadow: none;
        text-shadow: none;
        cursor: pointer;
        touch-action: manipulation;

        transition:
          background-color .15s ease,
          border-color .15s ease;
      }

      .zoom-controls button:active {
        background: var(--selected);
        border-color: var(--accent);
      }

      .zoom-controls button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      #author-details {
        z-index: 6 !important;
      }

    }
  </style>
</head>

<body>

  <header>
    <h1>ことばをたどる</h1>
    <p>乗っ取られて、嬉しい。</p>
  </header>

  <main class="workspace">

    <aside class="sidebar">
      <h2>誰をたどる？</h2>
      <div id="authors"></div>
    </aside>

    <section class="viewer">

      <div class="toolbar">

        <div class="mode-area">

          <label class="control-label" for="mode">
            どこをたどる？
          </label>

          <select id="mode"
                  aria-label="どこをたどる？"
                  aria-describedby="mode-description">

            <option value="mine">
              この人の作品
            </option>

            <option value="direct">
              乗っ取られた先
            </option>

            <option value="journey">
              乗っ取られた先の先
            </option>

            <option value="roots">
              乗っ取ってきた道
            </option>

          </select>

          <p id="mode-description" aria-live="polite">
            気になる作者を選んでください。
          </p>

        </div>

        <div class="zoom-controls">

          <button id="zoom-in" aria-label="拡大">＋</button>
          <button id="zoom-out" aria-label="縮小">－</button>
          <button id="reset">全体表示</button>

        </div>

      </div>

      <div class="graph-area">

        <svg id="tree"
             xmlns="http://www.w3.org/2000/svg"
             aria-label="ことばをたどる — つながりの図">
        </svg>

      </div>

      <p id="status"></p>

    </section>

  </main>

  <footer>

    <p>
      ことばは、誰かの文章から、また誰かの文章へ。
    </p>

    <p>
      <a href="https://note.com/zarinamo/n/n8840122ca349"
         target="_blank"
         rel="noopener noreferrer">
        遊び方
      </a>
      ｜
      <a href="https://note.com/zarinamo/m/m546e739befa5"
         target="_blank"
         rel="noopener noreferrer">
        参加作品マガジン
      </a>
    </p>

    <p>
      作品タイトルを押すと記事へ移動します。<br>
      作者一覧のアイコンからプロフィールへ移動できます。
    </p>

  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const mobileLayout =
        window.matchMedia("(max-width: 700px)");

      const toolbar =
        document.querySelector(".toolbar");

      const graphArea =
        document.querySelector(".graph-area");

      const zoomControls =
        document.querySelector(".zoom-controls");

      function arrangeZoomControls() {

        if (mobileLayout.matches) {
          graphArea.appendChild(zoomControls);
        } else {
          toolbar.appendChild(zoomControls);
        }

      }

      arrangeZoomControls();

      mobileLayout.addEventListener(
        "change",
        arrangeZoomControls
      );

    });
  </script>

</body>
</html>
