
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ことば乗っ取りゲームから生まれた作品のつながりをたどるサイトです。">
  <title>ことばの系譜</title>
  <link rel="stylesheet" href="style.css?v=20261126-4">
  <script src="script.js?v=20261126-6" defer></script>

  <style>
    .mode-area {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 190px;
      margin-right: auto;
    }

    #mode {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e2ded8;
      border-radius: 5px;
      background: white;
      color: #333;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    #mode-description {
      margin: 0;
      padding: 0 3px;
      color: #888;
      font-size: 11px;
      line-height: 1.5;
    }

    @media (max-width: 700px) {
      .mode-area {
        width: 100%;
        min-width: 0;
        margin-right: 0;
      }

      #mode-description {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">1</div>
    <h1>ことばの系譜</h1>
    <p>乗っ取られて、嬉しい。</p>
  </header>

  <main class="workspace">

    <aside class="sidebar">
      <h2>参加者一覧</h2>
      <div id="authors"></div>
    </aside>

    <section class="viewer">

      <div class="toolbar">

        <div class="mode-area">
          <select id="mode" aria-label="表示方法">
            <option value="mine">この人の作品</option>
            <option value="direct">ことばのバトン</option>
            <option value="journey">ことばの行方</option>
            <option value="roots">ルーツ</option>
          </select>

          <p id="mode-description">
            選んだ人が投稿した作品を見る
          </p>
        </div>

        <button id="zoom-in" aria-label="拡大">＋</button>
        <button id="zoom-out" aria-label="縮小">－</button>
        <button id="reset">全体表示</button>

      </div>

      <svg id="tree"
           xmlns="http://www.w3.org/2000/svg"
           aria-label="ことばの系譜図">
      </svg>

      <p id="status"></p>

    </section>

  </main>

  <footer>

    <p>
      ことばは、誰かの文章から、また誰かの文章へ。
    </p>

    <p>
      <a href="https://note.com/zarinamo/n/n8840122ca349"
         target="_blank"
         rel="noopener noreferrer">
        遊び方
      </a>
      ｜
      <a href="https://note.com/zarinamo/m/m546e739befa5"
         target="_blank"
         rel="noopener noreferrer">
        参加作品マガジン
      </a>
    </p>

    <p>
      作品タイトルをクリックすると記事へ移動します。<br>
      作者名をクリックするとプロフィールへ移動します。
    </p>

  </footer>

</body>
</html>
